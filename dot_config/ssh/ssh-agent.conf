# SSH Agent Configuration
# This file contains SSH agent settings and can be customized per system

# SSH agent socket location (default: /tmp/ssh-XXXXXX)
# Uncomment to set a custom location:
# export SSH_AUTH_SOCK="$HOME/.ssh/agent.sock"

# SSH agent timeout (in seconds)
# Default is 0 (no timeout), set to desired seconds for auto-logout
# export SSH_AGENT_TIMEOUT=3600

# Auto-add keys on startup (set to false to disable)
export SSH_AUTO_ADD_KEYS=true

# Key files to automatically load (space-separated)
# These will be loaded in order if they exist
export SSH_KEY_FILES="id_ed25519 id_rsa id_rsa_work id_rsa_dnlc id_ecdsa"

# Verbose output (set to true for detailed SSH agent messages)
export SSH_VERBOSE=false

